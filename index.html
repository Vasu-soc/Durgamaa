<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Goddess Durga Maa - Cinematic Devotional Animation</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Cinematic devotional particle animation of Goddess Durga Maa seated on a lion surrounded by a circular wall of flames.">
  <meta name="keywords" content="Durga Maa, Devotional, Particle Animation, WebGL, 60fps, Hindu Devotional">
  <meta name="author" content="Durga Maa Animation">
  <meta name="theme-color" content="#060302">

  <!-- Open Graph / WhatsApp / Facebook Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Goddess Durga Maa - Cinematic Devotional Animation">
  <meta property="og:description" content="Witness the divine presence of Goddess Durga Maa in this mesmerizing 60 FPS particle animation.">
  <meta property="og:image" content="./durga_ref.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Goddess Durga Maa - Devotional Particle Art">
  <meta name="twitter:description" content="Cinematic 60 FPS particle animation of Goddess Durga Maa.">
  <meta name="twitter:image" content="./durga_ref.jpg">

  <!-- PWA & Mobile Web App Support -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="durga_ref.jpg">
  <link rel="icon" type="image/jpeg" href="durga_ref.jpg">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <div id="stage-wrapper">
      <!-- Layer 1: Volumetric fiery background aura -->
      <canvas id="aura-canvas"></canvas>
      
      <!-- Layer 2: Main WebGL particle animation canvas -->
      <canvas id="particle-canvas"></canvas>
      
      <!-- Layer 3: Dynamic artist sketch strokes & golden stylus canvas -->
      <canvas id="sketch-canvas"></canvas>
      
      <!-- Layer 4: Rising foreground embers and sparks -->
      <canvas id="embers-canvas"></canvas>
      
      <!-- Layer 5: Cinematic optical vignette -->
      <div class="vignette-overlay"></div>
      
      <!-- Layer 6: Minimalist pure icon controls -->
      <div id="hud-overlay">
        <div class="hud-top">
          <div class="hud-group hud-left">
            <!-- Mode Toggle: Paint Sketch Drawing / Cosmic Swirl -->
            <button id="mode-btn" class="glass-icon-btn active" aria-label="Drawing Sketch Mode" title="Sketch Drawing Mode">
              <svg viewBox="0 0 24 24">
                <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.71a1 1 0 0 0-1.41 0l-9.59 9.58 2.83 2.83 9.59-9.59c.39-.38.39-1.02 0-1.41l-1.42-1.41z"/>
              </svg>
            </button>

            <!-- Replay Button -->
            <button id="replay-btn" class="glass-icon-btn replay-icon-btn" aria-label="Replay">
              <svg viewBox="0 0 24 24">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.77 20 14.44 20 13c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 8.74C4.46 10.23 4 11.56 4 13c0 4.42 3.58 8 8 8v4l5-5-5-5v4c-3.31 0-6-2.69-6-6z"/>
              </svg>
            </button>
            
            <!-- Aura Toggle -->
            <button id="glow-toggle-btn" class="glass-icon-btn active" aria-label="Aura">
              <svg viewBox="0 0 24 24">
                <path d="M12 6.5A5.5 5.5 0 1 1 6.5 12 5.5 5.5 0 0 1 12 6.5M12 2a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zm10-8a1 1 0 0 1-1 1h-2a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1zM5 12a1 1 0 0 1-1 1H2a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1zm14.07-7.07a1 1 0 0 1 0 1.41l-1.41 1.42a1 1 0 1 1-1.42-1.42l1.42-1.41a1 1 0 0 1 1.41 0zM6.34 17.66a1 1 0 0 1 0 1.41L4.93 20.5a1 1 0 0 1-1.41-1.42l1.41-1.42a1 1 0 0 1 1.41 0zm12.73 2.84a1 1 0 0 1-1.42 0l-1.41-1.41a1 1 0 1 1 1.41-1.42l1.42 1.42a1 1 0 0 1 0 1.41zM6.34 6.34a1 1 0 0 1-1.41 0L3.52 4.93A1 1 0 0 1 4.93 3.52l1.41 1.41a1 1 0 0 1 0 1.41z"/>
              </svg>
            </button>
          </div>

          <div class="hud-group hud-right">
            <!-- Audio Toggle -->
            <button id="sound-btn" class="glass-icon-btn" aria-label="Audio">
              <svg id="sound-icon-on" viewBox="0 0 24 24" style="display:none;">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <svg id="sound-icon-off" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
              </svg>
            </button>
            
            <!-- Fullscreen Toggle -->
            <button id="fullscreen-btn" class="glass-icon-btn" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load original particle dataset -->
  <script src="particles_data.js"></script>
  <!-- Main engine -->
  <script src="app.js"></script>
</body>
</html>
